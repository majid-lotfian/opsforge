<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsForge | Incident Intelligence</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9eef8;background:#0c1220}
body{max-width:1000px;margin:40px auto;padding:0 20px}h1{font-size:2.2rem;margin-bottom:0}
small,p{color:#a8b5cc}main{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}
section{background:#182337;border:1px solid #2a3b55;border-radius:16px;padding:24px}
label{display:block;margin:20px 0 8px}input,textarea{width:100%;box-sizing:border-box;background:#0c1628;border:1px solid #42536a;color:white;border-radius:8px;padding:12px;font:inherit}
textarea{min-height:180px}button{margin-top:18px;padding:12px 20px;background:#4f80ed;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}.result-field{margin:16px 0;line-height:1.55}.result-field>strong{display:block;margin-bottom:6px;text-transform:capitalize}.result-field ol,.result-field ul{padding-left:23px}.result-field li{margin:10px 0}.result-field p{margin:6px 0;color:#e9eef8}.result-field li div p{margin:4px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}a{color:#95b8ff}
@media(max-width:750px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>OpsForge</h1><p>Evidence-grounded incident investigation · Apache Airflow historical issues</p></header>
<main><section><h2>Investigate an incident</h2><form id="form">
<label for="title">Incident title</label><input id="title" minlength="5" maxlength="300" required placeholder="e.g. Scheduler fails to start">
<label for="description">Symptoms and context</label><textarea id="description" minlength="10" maxlength="10000" required placeholder="Describe errors, impact and observations"></textarea>
<button id="submit">Analyze incident</button></form></section>
<section><h2>Investigation</h2><p id="status">Submit an incident to see evidence-based recommendations.</p><div id="result"></div></section></main>
<script>
const form=document.querySelector('#form'),result=document.querySelector('#result'),status=document.querySelector('#status'),button=document.querySelector('#submit');
function heading(text){const h=document.createElement('h3');h.textContent=text;result.append(h)}
function pretty(key){return key.replaceAll('_',' ').replace(/\b\w/g,ch=>ch.toUpperCase())}
function valueNode(value){
  if(Array.isArray(value)){
    const list=document.createElement('ol');
    for(const entry of value){const li=document.createElement('li');li.append(valueNode(entry));list.append(li)}
    return list;
  }
  if(value&&typeof value==='object'){
    const container=document.createElement('div');
    for(const [key,entry] of Object.entries(value)){
      const p=document.createElement('p');
      const strong=document.createElement('strong');strong.textContent=pretty(key)+': ';
      p.append(strong,valueNode(entry));container.append(p);
    }
    return container;
  }
  return document.createTextNode(value==null?'Not available':String(value));
}
function line(label,value){
  const block=document.createElement('div');
  block.className='result-field';
  const strong=document.createElement('strong');strong.textContent=pretty(label);
  block.append(strong,valueNode(value));
  result.append(block);
}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;result.replaceChildren();status.textContent='Analyzing historical incidents…';
try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:form.title?.value||document.querySelector('#title').value,description:document.querySelector('#description').value})});
if(!response.ok)throw new Error('Analysis failed (HTTP '+response.status+')');
const data=await response.json();status.textContent='Analysis complete';
for(const key of ['summary','category','severity','confidence','likely_causes','recommended_steps','missing_information'])line(key,data[key]);
if(data.retrieval_method)line('retrieval_method',data.retrieval_method);
const h=document.createElement('h3');h.textContent='Historical evidence';result.append(h);
for(const source of data.sources||[]){const p=document.createElement('p'),a=document.createElement('a');a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='#'+source.issue_number+' '+source.title;p.append(a);result.append(p)}
}catch(err){status.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
