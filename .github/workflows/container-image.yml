name: Build OpsForge container
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'Dockerfile', '.dockerignore', '.github/workflows/container-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/majid-lotfian/opsforge:latest,ghcr.io/majid-lotfian/opsforge:${{ github.sha }}
