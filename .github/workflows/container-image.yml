name: Build OpsForge container
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'Dockerfile', '.dockerignore', '.github/workflows/container-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/majid-lotfian/opsforge:latest,ghcr.io/majid-lotfian/opsforge:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: opsforge-azure-deployment
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image
        run: |
          az containerapp update --resource-group rg-opsforge-dev --name opsforge-api-dev --image ghcr.io/majid-lotfian/opsforge:${{ github.sha }} --output none

  deploy-indexer:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_INDEXER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: opsforge-azure-indexer-deployment
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable indexer image
        run: |
          az containerapp job update --resource-group rg-opsforge-dev --name opsforge-indexer-dev --image ghcr.io/majid-lotfian/opsforge:${{ github.sha }} --output none
      - name: Verify configured image
        run: |
          actual=$(az containerapp job show --resource-group rg-opsforge-dev --name opsforge-indexer-dev --query "properties.template.containers[?name=='opsforge-indexer-dev'].image | [0]" -o tsv)
          test "$actual" = "ghcr.io/majid-lotfian/opsforge:${{ github.sha }}"
