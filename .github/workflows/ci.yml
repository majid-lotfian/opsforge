name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Verify repository setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required project files
        shell: bash
        run: |
          test -f README.md
          echo 'Repository validation passed.'
