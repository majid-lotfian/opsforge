name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Verify repository setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required project files
        shell: bash
        run: |
          test -f README.md
          test -f app/data.py
          test -f app/agent.py
      - name: Verify Python syntax
        run: python -m compileall -q app scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
